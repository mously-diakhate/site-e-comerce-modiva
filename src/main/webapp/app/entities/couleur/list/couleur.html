<div class="modiva-list-wrap">
  <div class="list-topbar">
    <h2 id="page-heading" data-cy="CouleurHeading" class="list-title">
      <span jhiTranslate="modivaApp.couleur.home.title">Couleurs</span>
    </h2>

    <div class="list-actions">
      <button class="btn btn-outline-modiva" (click)="load()" [disabled]="isLoading()">
        <fa-icon icon="sync" [animation]="isLoading() ? 'spin' : undefined" />
        <span class="d-none d-md-inline" jhiTranslate="modivaApp.couleur.home.refreshListLabel">Actualiser</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-modiva-primary create-couleur"
        [routerLink]="['/couleur/new']"
      >
        <fa-icon icon="plus" />
        <span jhiTranslate="modivaApp.couleur.home.createLabel">Créer un nouveau Couleur</span>
      </button>
    </div>
  </div>

  <jhi-alert-error />
  <jhi-alert />

  @if (couleurs().length === 0) {
    <div class="empty-state" id="no-result">
      <fa-icon icon="list" />
      <span jhiTranslate="modivaApp.couleur.home.notFound">Aucun Couleur trouvé</span>
    </div>
  } @else {
    <div class="table-card">
      <table class="modiva-table" aria-describedby="page-heading">
        <thead>
          <tr>
            <th scope="col"><span jhiTranslate="modivaApp.couleur.libelle">Libelle</span></th>
            <th scope="col"><span jhiTranslate="modivaApp.couleur.codeHex">Code Hex</span></th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          @for (couleur of couleurs(); track trackId(couleur)) {
            <tr data-cy="entityTable">
              <td class="cell-strong">
                <a [routerLink]="['/couleur', couleur.id, 'view']" class="couleur-name">
                  <span class="color-dot" [style.background]="couleur.codeHex"></span>
                  {{ couleur.libelle }}
                </a>
              </td>
              <td class="cell-muted">{{ couleur.codeHex || '—' }}</td>
              <td class="text-end">
                <div class="table-actions">
                  <a [routerLink]="['/couleur', couleur.id, 'view']" class="icon-btn" data-cy="entityDetailsButton" title="Voir">
                    <fa-icon icon="eye" />
                  </a>
                  <a [routerLink]="['/couleur', couleur.id, 'edit']" class="icon-btn" data-cy="entityEditButton" title="Éditer">
                    <fa-icon icon="pencil-alt" />
                  </a>
                  <button type="submit" (click)="delete(couleur)" class="icon-btn danger" data-cy="entityDeleteButton" title="Supprimer">
                    <fa-icon icon="times" />
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
