<div class="modiva-detail-wrap">
  <div class="modiva-detail-card">
    @if (couleur(); as couleurRef) {
      <div>
        <h2 data-cy="couleurDetailsHeading" class="detail-title">
          <span jhiTranslate="modivaApp.couleur.detail.title">Couleur</span>
          <span class="detail-nom">
            <span class="color-dot-lg" [style.background]="couleurRef.codeHex"></span>
            {{ couleurRef.libelle }}
          </span>
        </h2>

        <jhi-alert-error />
        <jhi-alert />

        <div class="info">
          <div class="info-row">
            <span class="info-label" jhiTranslate="modivaApp.couleur.libelle">Libelle</span>
            <span class="info-value">{{ couleurRef.libelle }}</span>
          </div>
          <div class="info-row">
            <span class="info-label" jhiTranslate="modivaApp.couleur.codeHex">Code Hex</span>
            <span class="info-value">{{ couleurRef.codeHex || '—' }}</span>
          </div>

          <div class="detail-actions">
            <button type="submit" (click)="previousState()" class="btn btn-secondary" data-cy="entityDetailsBackButton">
              <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
            </button>

            <button type="button" [routerLink]="['/couleur', couleurRef.id, 'edit']" class="btn btn-modiva-primary">
              <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
