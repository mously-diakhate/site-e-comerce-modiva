<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (couleur(); as couleurRef) {
      <div>
        <h2 data-cy="couleurDetailsHeading"><span jhiTranslate="modivaApp.couleur.detail.title">Couleur</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ couleurRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="modivaApp.couleur.libelle">Libelle</span></dt>
          <dd>
            <span>{{ couleurRef.libelle }}</span>
          </dd>
          <dt><span jhiTranslate="modivaApp.couleur.codeHex">Code Hex</span></dt>
          <dd>
            <span>{{ couleurRef.codeHex }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
        </button>

        <button type="button" [routerLink]="['/couleur', couleurRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
        </button>
      </div>
    }
  </div>
</div>
