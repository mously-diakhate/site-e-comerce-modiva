<div class="modiva-form-wrap">
  <div class="modiva-form-card">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2 id="jhi-categorie-heading" data-cy="CategorieCreateUpdateHeading" class="form-title">
        <span jhiTranslate="modivaApp.categorie.home.createOrEditLabel">Créer ou éditer un Categorie</span>
      </h2>

      <jhi-alert-error />

      @let nomRef = editForm.get('nom')!;
      <div class="mb-3">
        <label class="form-label" for="field_nom" jhiTranslate="modivaApp.categorie.nom">Nom</label>
        <input type="text" class="form-control" name="nom" id="field_nom" data-cy="nom" formControlName="nom" />
        @if (nomRef.invalid && (nomRef.dirty || nomRef.touched)) {
          <div>
            @if (nomRef.errors?.required) {
              <small class="form-text text-danger" jhiTranslate="entity.validation.required">Ce champ est obligatoire.</small>
            }
          </div>
        }
      </div>

      <div class="mb-3">
        <label class="form-label" for="field_description" jhiTranslate="modivaApp.categorie.description">Description</label>
        <input
          type="text"
          class="form-control"
          name="description"
          id="field_description"
          data-cy="description"
          formControlName="description"
        />
      </div>

      <div class="form-actions">
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="btn btn-modiva-primary"
        >
          <fa-icon icon="save" />&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
