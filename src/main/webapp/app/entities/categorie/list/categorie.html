<div class="modiva-list-wrap">
  <div class="list-topbar">
    <h2 id="page-heading" data-cy="CategorieHeading" class="list-title">
      <span jhiTranslate="modivaApp.categorie.home.title">Categories</span>
    </h2>

    <div class="list-actions">
      <button class="btn btn-outline-modiva" (click)="load()" [disabled]="isLoading()">
        <fa-icon icon="sync" [animation]="isLoading() ? 'spin' : undefined" />
        <span class="d-none d-md-inline" jhiTranslate="modivaApp.categorie.home.refreshListLabel">Actualiser</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-modiva-primary create-categorie"
        [routerLink]="['/categorie/new']"
      >
        <fa-icon icon="plus" />
        <span jhiTranslate="modivaApp.categorie.home.createLabel">Créer un nouveau Categorie</span>
      </button>
    </div>
  </div>

  <jhi-alert-error />
  <jhi-alert />

  @if (categories().length === 0) {
    <div class="empty-state" id="no-result">
      <fa-icon icon="list" />
      <span jhiTranslate="modivaApp.categorie.home.notFound">Aucun Categorie trouvé</span>
    </div>
  } @else {
    <div class="table-card">
      <table class="modiva-table" aria-describedby="page-heading">
        <thead>
          <tr jhiSort [(sortState)]="sortState" (sortChange)="navigateToWithComponentValues($event)">
            <th scope="col" jhiSortBy="nom">
              <div class="th-inner"><span jhiTranslate="modivaApp.categorie.nom">Nom</span><fa-icon icon="sort" /></div>
            </th>
            <th scope="col" jhiSortBy="description">
              <div class="th-inner"><span jhiTranslate="modivaApp.categorie.description">Description</span><fa-icon icon="sort" /></div>
            </th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          @for (categorie of categories(); track trackId(categorie)) {
            <tr data-cy="entityTable">
              <td class="cell-strong">
                <a [routerLink]="['/categorie', categorie.id, 'view']">{{ categorie.nom }}</a>
              </td>
              <td class="cell-muted">{{ categorie.description || '—' }}</td>
              <td class="text-end">
                <div class="table-actions">
                  <button
                    type="submit"
                    [routerLink]="['/produit']"
                    [queryParams]="{ 'filter[categorieId.in]': categorie.id }"
                    class="icon-btn"
                    data-cy="filterOtherEntityButton"
                    title="Voir les produits"
                  >
                    <fa-icon icon="bag-shopping" />
                  </button>
                  <a [routerLink]="['/categorie', categorie.id, 'view']" class="icon-btn" data-cy="entityDetailsButton" title="Voir">
                    <fa-icon icon="eye" />
                  </a>
                  <a [routerLink]="['/categorie', categorie.id, 'edit']" class="icon-btn" data-cy="entityEditButton" title="Éditer">
                    <fa-icon icon="pencil-alt" />
                  </a>
                  <button type="submit" (click)="delete(categorie)" class="icon-btn danger" data-cy="entityDeleteButton" title="Supprimer">
                    <fa-icon icon="times" />
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }

  @if (categories().length > 0) {
    <div>
      <div class="d-flex justify-content-center">
        <jhi-item-count [params]="{ page: page(), totalItems: totalItems(), itemsPerPage: itemsPerPage() }" />
      </div>

      <div class="d-flex justify-content-center">
        <ngb-pagination
          [collectionSize]="totalItems()"
          [page]="page()"
          [pageSize]="itemsPerPage()"
          [maxSize]="5"
          [rotate]="true"
          [boundaryLinks]="true"
          (pageChange)="navigateToPage($event)"
        />
      </div>
    </div>
  }
</div>
