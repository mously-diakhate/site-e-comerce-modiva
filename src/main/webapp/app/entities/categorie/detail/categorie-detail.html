<div class="modiva-detail-wrap">
  <div class="modiva-detail-card">
    @if (categorie(); as categorieRef) {
      <div>
        <h2 data-cy="categorieDetailsHeading" class="detail-title">
          <span jhiTranslate="modivaApp.categorie.detail.title">Categorie</span>
          <span class="detail-nom">{{ categorieRef.nom }}</span>
        </h2>

        <jhi-alert-error />
        <jhi-alert />

        <div class="info">
          <div class="info-row">
            <span class="info-label" jhiTranslate="modivaApp.categorie.nom">Nom</span>
            <span class="info-value">{{ categorieRef.nom }}</span>
          </div>
          <div class="info-row">
            <span class="info-label" jhiTranslate="modivaApp.categorie.description">Description</span>
            <span class="info-value">{{ categorieRef.description || '—' }}</span>
          </div>

          <div class="detail-actions">
            <button type="submit" (click)="previousState()" class="btn btn-secondary" data-cy="entityDetailsBackButton">
              <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
            </button>

            <button type="button" [routerLink]="['/categorie', categorieRef.id, 'edit']" class="btn btn-modiva-primary">
              <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
