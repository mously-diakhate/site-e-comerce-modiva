<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (panier(); as panierRef) {
      <div>
        <h2 data-cy="panierDetailsHeading"><span jhiTranslate="modivaApp.panier.detail.title">Panier</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ panierRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="modivaApp.panier.dateCreation">Date Creation</span></dt>
          <dd>
            <span>{{ panierRef.dateCreation | formatMediumDatetime }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
        </button>

        <button type="button" [routerLink]="['/panier', panierRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
        </button>
      </div>
    }
  </div>
</div>
