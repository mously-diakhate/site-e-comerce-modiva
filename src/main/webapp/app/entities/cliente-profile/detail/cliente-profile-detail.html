<div class="modiva-detail-wrap">
  <div class="modiva-detail-card">
    @if (clienteProfile(); as clienteProfileRef) {
      <div>
        <div class="detail-header">
          <h2 data-cy="clienteProfileDetailsHeading" class="detail-title">
            <span jhiTranslate="modivaApp.clienteProfile.detail.title">Profil cliente</span>
            <span class="detail-telephone">{{ clienteProfileRef.telephone ?? '—' }}</span>
          </h2>
          <button
            type="button"
            class="statut-toggle"
            [class.actif]="clienteProfileRef.actif"
            (click)="toggleActif()"
            [title]="clienteProfileRef.actif ? 'Cliquer pour désactiver' : 'Cliquer pour activer'"
          >
            <span class="statut-dot"></span>
            {{ clienteProfileRef.actif ? 'Actif' : 'Inactif' }}
          </button>
        </div>

        <jhi-alert-error></jhi-alert-error>
        <jhi-alert></jhi-alert>

        <div class="info">
          <div class="info-row">
            <span class="info-label" jhiTranslate="modivaApp.clienteProfile.telephone">Téléphone</span>
            <span class="info-value">{{ clienteProfileRef.telephone ?? '—' }}</span>
          </div>
          <div class="info-row">
            <span class="info-label" jhiTranslate="modivaApp.clienteProfile.user">Compte</span>
            <span class="info-value">{{ clienteProfileRef.user?.login ?? '—' }}</span>
          </div>
          <div class="info-row">
            <span class="info-label" jhiTranslate="modivaApp.clienteProfile.actif">Statut</span>
            <span class="info-value">
              <span class="statut-badge-inline" [class.actif]="clienteProfileRef.actif">
                {{ clienteProfileRef.actif ? 'Actif' : 'Inactif' }}
              </span>
            </span>
          </div>

          <div class="detail-actions">
            <button type="submit" (click)="previousState()" class="btn btn-secondary" data-cy="entityDetailsBackButton">
              <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
            </button>

            <a
              [routerLink]="['/commande']"
              [queryParams]="{ 'filter[clienteProfileId.in]': clienteProfileRef.id }"
              class="btn btn-modiva-primary"
            >
              <fa-icon icon="receipt"></fa-icon>&nbsp;Voir ses commandes
            </a>
          </div>
        </div>
      </div>
    }
  </div>
</div>
