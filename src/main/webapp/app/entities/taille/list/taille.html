<div class="modiva-list-wrap">
  <div class="list-topbar">
    <h2 id="page-heading" data-cy="TailleHeading" class="list-title">
      <span jhiTranslate="modivaApp.taille.home.title">Tailles</span>
    </h2>

    <div class="list-actions">
      <button class="btn btn-outline-modiva" (click)="load()" [disabled]="isLoading()">
        <fa-icon icon="sync" [animation]="isLoading() ? 'spin' : undefined" />
        <span class="d-none d-md-inline" jhiTranslate="modivaApp.taille.home.refreshListLabel">Actualiser</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-modiva-primary create-taille"
        [routerLink]="['/taille/new']"
      >
        <fa-icon icon="plus" />
        <span jhiTranslate="modivaApp.taille.home.createLabel">Créer un nouveau Taille</span>
      </button>
    </div>
  </div>

  <jhi-alert-error />
  <jhi-alert />

  @if (tailles().length === 0) {
    <div class="empty-state" id="no-result">
      <fa-icon icon="list" />
      <span jhiTranslate="modivaApp.taille.home.notFound">Aucun Taille trouvé</span>
    </div>
  } @else {
    <div class="table-card">
      <table class="modiva-table" aria-describedby="page-heading">
        <thead>
          <tr jhiSort [(sortState)]="sortState" (sortChange)="navigateToWithComponentValues($event)">
            <th scope="col" jhiSortBy="libelle">
              <div class="th-inner"><span jhiTranslate="modivaApp.taille.libelle">Libelle</span><fa-icon icon="sort" /></div>
            </th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          @for (taille of tailles(); track trackId(taille)) {
            <tr data-cy="entityTable">
              <td class="cell-strong">
                <a [routerLink]="['/taille', taille.id, 'view']">{{ taille.libelle }}</a>
              </td>
              <td class="text-end">
                <div class="table-actions">
                  <a [routerLink]="['/taille', taille.id, 'view']" class="icon-btn" data-cy="entityDetailsButton" title="Voir">
                    <fa-icon icon="eye" />
                  </a>
                  <a [routerLink]="['/taille', taille.id, 'edit']" class="icon-btn" data-cy="entityEditButton" title="Éditer">
                    <fa-icon icon="pencil-alt" />
                  </a>
                  <button type="submit" (click)="delete(taille)" class="icon-btn danger" data-cy="entityDeleteButton" title="Supprimer">
                    <fa-icon icon="times" />
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
