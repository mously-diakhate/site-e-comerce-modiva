<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (taille(); as tailleRef) {
      <div>
        <h2 data-cy="tailleDetailsHeading"><span jhiTranslate="modivaApp.taille.detail.title">Taille</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ tailleRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="modivaApp.taille.libelle">Libelle</span></dt>
          <dd>
            <span>{{ tailleRef.libelle }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
        </button>

        <button type="button" [routerLink]="['/taille', tailleRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
        </button>
      </div>
    }
  </div>
</div>
