<div class="modiva-detail-wrap">
  <div class="modiva-detail-card">
    @if (taille(); as tailleRef) {
      <div>
        <h2 data-cy="tailleDetailsHeading" class="detail-title">
          <span jhiTranslate="modivaApp.taille.detail.title">Taille</span>
          <span class="detail-nom">{{ tailleRef.libelle }}</span>
        </h2>

        <jhi-alert-error />
        <jhi-alert />

        <div class="info">
          <div class="info-row">
            <span class="info-label" jhiTranslate="modivaApp.taille.libelle">Libelle</span>
            <span class="info-value">{{ tailleRef.libelle }}</span>
          </div>

          <div class="detail-actions">
            <button type="submit" (click)="previousState()" class="btn btn-secondary" data-cy="entityDetailsBackButton">
              <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
            </button>

            <button type="button" [routerLink]="['/taille', tailleRef.id, 'edit']" class="btn btn-modiva-primary">
              <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
