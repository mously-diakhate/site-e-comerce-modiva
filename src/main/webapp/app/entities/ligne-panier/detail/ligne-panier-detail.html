<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (lignePanier(); as lignePanierRef) {
      <div>
        <h2 data-cy="lignePanierDetailsHeading"><span jhiTranslate="modivaApp.lignePanier.detail.title">Ligne Panier</span></h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ lignePanierRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="modivaApp.lignePanier.quantite">Quantite</span></dt>
          <dd>
            <span>{{ lignePanierRef.quantite }}</span>
          </dd>
          <dt><span jhiTranslate="modivaApp.lignePanier.variante">Variante</span></dt>
          <dd>
            @if (lignePanier()!.variante) {
              <div>
                <a [routerLink]="['/variante-produit', lignePanier()!.variante?.id, 'view']">{{ lignePanierRef.variante?.id }}</a>
              </div>
            }
          </dd>
          <dt><span jhiTranslate="modivaApp.lignePanier.panier">Panier</span></dt>
          <dd>
            @if (lignePanier()!.panier) {
              <div>
                <a [routerLink]="['/panier', lignePanier()!.panier?.id, 'view']">{{ lignePanierRef.panier?.id }}</a>
              </div>
            }
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
        </button>

        <button type="button" [routerLink]="['/ligne-panier', lignePanierRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
        </button>
      </div>
    }
  </div>
</div>
